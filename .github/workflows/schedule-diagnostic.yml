name: Schedule diagnostic (temporary)

on:
  schedule:
    - cron: '4-59/5 * * * *'

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record a scheduled event from a fresh workflow
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          printf 'Scheduled event received at %s\nCron: %s\nRef: %s\nCommit: %s\n' \
            "$(date -u +%FT%TZ)" "$SCHEDULE" "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
