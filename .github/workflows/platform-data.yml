name: Platform data

on:
  schedule:
    # Monday 09:17 in Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, or update data and open a pull request
        required: true
        default: check
        type: choice
        options:
          - check
          - update

concurrency:
  group: platform-data-${{ github.event_name }}-${{ inputs.mode || 'check' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Test scraper parsers
        run: npm --prefix .utils test

      - name: Check upstream platform data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          npm --prefix .utils run check-data
          status=$?
          set -e
          if [[ "$status" -eq 2 ]]; then
            echo "::error title=Platform data update available::Run this workflow manually with mode=update to open a pull request."
            exit 1
          fi
          exit "$status"

  update:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Temurin 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Update platform data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix .utils run update-data

      - name: Verify generated data and plugin behavior
        run: |
          npm --prefix .utils test
          bash ./gradlew check --no-daemon
          bash ./gradlew -p sample printPlatformVersions --no-daemon

      - name: Validate generated diff scope
        id: changes
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only)
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No platform data changes were generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            if [[ "$file" != src/main/resources/org/autojs/build/platform/data/* ]]; then
              echo "::error title=Unexpected generated file::$file"
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/platform-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add src/main/resources/org/autojs/build/platform/data
          git commit -m "Update platform compatibility data"
          git push --set-upstream origin "$UPDATE_BRANCH"

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/platform-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          pr_url="$(gh pr create \
            --base master \
            --head "$UPDATE_BRANCH" \
            --title "Update platform compatibility data" \
            --body "Generated by the Platform data workflow after parsing the official upstream sources. Parser tests, Gradle tests, and the headless sample all passed in the same run.")"
          echo "Opened update pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
