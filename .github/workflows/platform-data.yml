name: Platform data

on:
  schedule:
    # Every day at 09:17 in Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, open a data PR, or run the guarded automatic patch-release path
        required: true
        default: check
        type: choice
        options:
          - check
          - update-pr
          - release

permissions:
  contents: read

concurrency:
  group: platform-data
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Test scraper parsers
        run: npm --prefix .utils test

      - name: Check upstream platform data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          npm --prefix .utils run check-data
          status=$?
          set -e
          if [[ "$status" -eq 2 ]]; then
            echo "::error title=Platform data update available::Run mode=update-pr for review, or mode=release for the guarded patch-release path."
            exit 1
          fi
          exit "$status"

  update-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Temurin 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Update platform data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix .utils run update-data

      - name: Verify generated data and plugin behavior
        run: |
          npm --prefix .utils test
          bash ./gradlew check --no-daemon
          bash ./gradlew -p sample printPlatformVersions --no-daemon

      - name: Validate generated diff scope
        id: changes
        shell: bash
        run: |
          mapfile -t changed_files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No platform data changes were generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            if [[ "$file" != src/main/resources/org/autojs/build/platform/data/* ]]; then
              echo "::error title=Unexpected generated file::$file"
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/platform-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add src/main/resources/org/autojs/build/platform/data
          git commit -m "Update platform compatibility data"
          git push --set-upstream origin "$UPDATE_BRANCH"

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/platform-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          pr_url="$(gh pr create \
            --base master \
            --head "$UPDATE_BRANCH" \
            --title "Update platform compatibility data" \
            --body "Generated by the Platform data workflow after parsing the official upstream sources. Parser tests, Gradle tests, and the headless sample all passed in the same run.")"
          echo "Opened update pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'schedule' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out master with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate automatic-release source branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error title=Master branch required::Run the automatic release mode from master."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error title=Dirty checkout::The release runner did not start from a clean checkout."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Update platform data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix .utils run update-data

      - name: Detect releasable platform-data changes
        id: changes
        shell: bash
        run: |
          data_dir="src/main/resources/org/autojs/build/platform/data"
          current_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')"
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$latest_tag" ]]; then
            echo "::error title=Release history missing::No semantic version tag is available as the automation baseline."
            exit 1
          fi
          if [[ "$latest_tag" != "v${current_version}" ]]; then
            echo "::error title=Version baseline mismatch::Latest tag is $latest_tag but VERSION_NAME is $current_version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo "::error title=Release baseline mismatch::$latest_tag is not an ancestor of master."
            exit 1
          fi
          if [[ "$(git cat-file -t "$latest_tag")" != "tag" ]]; then
            echo "::error title=Annotated tag required::$latest_tag is not an annotated release tag."
            exit 1
          fi

          mapfile -t generated_changes < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          mapfile -t committed_changes < <(git diff --name-only "$latest_tag..HEAD" -- "$data_dir")
          for file in "${generated_changes[@]}"; do
            if [[ "$file" != "$data_dir"/* ]]; then
              echo "::error title=Unexpected generated file::$file"
              exit 1
            fi
          done
          if [[ "${#generated_changes[@]}" -eq 0 && "${#committed_changes[@]}" -eq 0 ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No new platform-data changes were found; no repository, tag, registry, or release mutation was performed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          {
            echo "Platform-data release required."
            echo "Generated changes in this run: ${#generated_changes[@]}"
            echo "Merged data changes since $latest_tag: ${#committed_changes[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce the data-only automatic-release boundary
        if: steps.changes.outputs.should_release == 'true'
        env:
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
        shell: bash
        run: |
          mapfile -t pending_files < <(git diff --name-only "$LATEST_TAG..HEAD")
          for file in "${pending_files[@]}"; do
            case "$file" in
              src/main/resources/org/autojs/build/platform/data/* | \
              .github/workflows/* | \
              .utils/* | \
              .python/* | \
              .readme/* | \
              docs/* | \
              README.md | Roadmap.md | PUBLISHING.md | version.properties | run-scrapers.bat)
                ;;
              *)
                echo "::error title=Manual release required::$file changed after $LATEST_TAG and is outside the data-release automation boundary."
                exit 1
                ;;
            esac
          done

      - name: Prepare the next patch release metadata
        if: steps.changes.outputs.should_release == 'true'
        id: metadata
        shell: bash
        run: |
          next_build="$(( $(git rev-list --count HEAD) + 1 ))"
          npm --prefix .utils run prepare-data-release -- --version-build "$next_build"
          python .python/generate_markdown.py

          release_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')"
          version_build="$(sed -n 's/^VERSION_BUILD=//p' version.properties | tr -d '\r')"
          if [[ "$version_build" != "$next_build" ]]; then
            echo "::error title=Build metadata mismatch::Expected VERSION_BUILD=$next_build but found $version_build."
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${release_version}" >> "$GITHUB_OUTPUT"
          echo "Prepared automatic patch release v${release_version} with build $version_build." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release diff and generated documentation
        if: steps.changes.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          mapfile -t changed_files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "::error title=Release diff missing::The release path produced no files to commit."
            exit 1
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              src/main/resources/org/autojs/build/platform/data/* | \
              version.properties | \
              .readme/common.json | \
              .readme/README-*.md | \
              .changelog/lang_*.json | \
              .changelog/CHANGELOG-*.md | \
              README.md)
                ;;
              *)
                echo "::error title=Unexpected release file::$file"
                exit 1
                ;;
            esac
          done

          before_hash="$(git diff --binary | git hash-object --stdin)"
          python .python/generate_markdown.py
          after_hash="$(git diff --binary | git hash-object --stdin)"
          if [[ "$before_hash" != "$after_hash" ]]; then
            echo "::error title=Non-deterministic documentation::A second Markdown generation changed the release diff."
            exit 1
          fi
          if ! grep -q "^# v${RELEASE_VERSION}$" .changelog/CHANGELOG-en.md; then
            echo "::error title=English release notes missing::The generated changelog does not contain v${RELEASE_VERSION}."
            exit 1
          fi

      - name: Set up Temurin 17
        if: steps.changes.outputs.should_release == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the exact release source and artifacts
        if: steps.changes.outputs.should_release == 'true'
        run: |
          python .python/check_translations.py
          npm --prefix .utils test
          bash ./gradlew check --no-daemon
          bash ./gradlew -p sample printPlatformVersions --no-daemon
          bash ./gradlew publishAllPublicationsToTestMavenRepository --no-daemon

      - name: Confirm that the release version is unused
        if: steps.changes.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error title=Release tag already exists::$RELEASE_TAG already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag already exists::$RELEASE_TAG already exists on GitHub."
            exit 1
          fi
          release_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$release_code" != "404" ]]; then
            echo "::error title=GitHub release coordinate is not unused::Expected HTTP 404 for $RELEASE_TAG but received $release_code."
            exit 1
          fi

          central_base="https://repo.maven.apache.org/maven2/io/github/supermonster003"
          portal_base="https://plugins.gradle.org/m2/io/github/supermonster003"
          marker_path="autojs6-platform-versions/io.github.supermonster003.autojs6-platform-versions.gradle.plugin/$RELEASE_VERSION/io.github.supermonster003.autojs6-platform-versions.gradle.plugin-$RELEASE_VERSION.pom"
          implementation_path="autojs6-gradle-platform-versions/$RELEASE_VERSION/autojs6-gradle-platform-versions-$RELEASE_VERSION.jar"
          urls=(
            "$central_base/$marker_path"
            "$central_base/$implementation_path"
            "$portal_base/$marker_path"
            "$portal_base/$implementation_path"
          )
          for url in "${urls[@]}"; do
            status_code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status_code" != "404" ]]; then
              echo "::error title=Release coordinate is not unused::$url returned HTTP $status_code instead of 404."
              exit 1
            fi
          done

      - name: Commit, tag, and atomically push the data release
        if: steps.changes.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Release $RELEASE_VERSION with refreshed platform data"

          version_build="$(sed -n 's/^VERSION_BUILD=//p' version.properties | tr -d '\r')"
          commit_count="$(git rev-list --count HEAD)"
          if [[ "$version_build" != "$commit_count" ]]; then
            echo "::error title=Build number mismatch::VERSION_BUILD=$version_build but the release commit contains $commit_count commits."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error title=Dirty release commit::Files remain outside the release commit."
            exit 1
          fi

          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_VERSION"
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_master" != "$GITHUB_SHA" ]]; then
            echo "::error title=Master advanced::Expected $GITHUB_SHA but origin/master is $remote_master; retry from the new head."
            exit 1
          fi
          git push --atomic origin \
            "HEAD:refs/heads/master" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          echo "Pushed release commit and annotated tag $RELEASE_TAG atomically." >> "$GITHUB_STEP_SUMMARY"

      - name: Start the protected registry publication
        if: steps.changes.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          dispatched=false
          for attempt in {1..6}; do
            if gh workflow run publish.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_TAG" \
              --raw-field version="$RELEASE_VERSION" \
              --raw-field targets=both \
              --raw-field complete_github_release=true; then
              dispatched=true
              break
            fi
            echo "Waiting for the pushed tag to become dispatchable (attempt $attempt/6)."
            sleep 10
          done
          if [[ "$dispatched" != "true" ]]; then
            echo "::error title=Publish dispatch failed::$RELEASE_TAG was pushed, but Publish release could not be started. Run it manually for this tag."
            exit 1
          fi

          actions_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish.yml"
          {
            echo "Started the protected Publish release workflow for $RELEASE_TAG."
            echo "Approve its release Environment deployment to expose publishing secrets and finish Maven Central, Plugin Portal, and GitHub Release publication."
            echo "Workflow: $actions_url"
          } >> "$GITHUB_STEP_SUMMARY"
