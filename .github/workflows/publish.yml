name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v; must match version.properties and the selected tag
        required: true
        type: string
      targets:
        description: Registry target; choose one target to recover safely from a partial publication
        required: true
        default: both
        type: choice
        options:
          - both
          - maven-central
          - gradle-plugin-portal
      central_publishing_type:
        description: USER_MANAGED waits for a final confirmation in Central Portal
        required: true
        default: USER_MANAGED
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out selected release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate tag and release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          release_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')"
          version_build="$(sed -n 's/^VERSION_BUILD=//p' version.properties | tr -d '\r')"
          commit_count="$(git rev-list --count HEAD)"

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error title=Release tag required::Select tag v${REQUESTED_VERSION} in the Run workflow branch/tag selector."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${REQUESTED_VERSION}" ]]; then
            echo "::error title=Tag mismatch::Selected $GITHUB_REF_NAME but requested v${REQUESTED_VERSION}."
            exit 1
          fi
          if [[ "$release_version" != "$REQUESTED_VERSION" ]]; then
            echo "::error title=Version mismatch::version.properties contains $release_version."
            exit 1
          fi
          if [[ "$version_build" != "$commit_count" ]]; then
            echo "::error title=Build number mismatch::VERSION_BUILD=$version_build but the tag contains $commit_count commits."
            exit 1
          fi

      - name: Set up Temurin 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install and test scraper suite
        run: |
          npm --prefix .utils ci --no-audit --no-fund
          npm --prefix .utils test

      - name: Test release source
        run: |
          bash ./gradlew check --no-daemon
          bash ./gradlew -p sample printPlatformVersions --no-daemon

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release

    steps:
      - name: Check out selected release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Temurin 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate protected publishing secrets
        env:
          TARGETS: ${{ inputs.targets }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          require_secret() {
            local name="$1"
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release secret::$name is not configured in the release environment."
              exit 1
            fi
          }

          require_secret SIGNING_KEY
          require_secret SIGNING_PASSWORD
          if [[ "$TARGETS" == "both" || "$TARGETS" == "maven-central" ]]; then
            require_secret CENTRAL_USERNAME
            require_secret CENTRAL_PASSWORD
          fi
          if [[ "$TARGETS" == "both" || "$TARGETS" == "gradle-plugin-portal" ]]; then
            require_secret GRADLE_PUBLISH_KEY
            require_secret GRADLE_PUBLISH_SECRET
          fi

      - name: Build signed Maven Central bundle
        if: inputs.targets == 'both' || inputs.targets == 'maven-central'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash ./gradlew centralBundle --no-daemon --stacktrace

      - name: Upload and validate Maven Central deployment
        if: inputs.targets == 'both' || inputs.targets == 'maven-central'
        id: central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_PUBLISHING_TYPE: ${{ inputs.central_publishing_type }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(build/central-bundle/*-central-bundle.zip)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "::error title=Central bundle missing::Expected exactly one bundle, found ${#bundles[@]}."
            exit 1
          fi

          central_auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_auth"
          upload_url="https://central.sonatype.com/api/v1/publisher/upload?name=autojs6-gradle-platform-versions-${RELEASE_VERSION}&publishingType=${CENTRAL_PUBLISHING_TYPE}"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $central_auth" \
            --form "bundle=@${bundles[0]};type=application/octet-stream" \
            "$upload_url")"

          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error title=Unexpected Central response::The upload did not return a deployment UUID."
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Maven Central deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"

          expected_state="VALIDATED"
          if [[ "$CENTRAL_PUBLISHING_TYPE" == "AUTOMATIC" ]]; then
            expected_state="PUBLISHED"
          fi

          for attempt in {1..120}; do
            status_json="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $central_auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            state="$(jq -r '.deploymentState' <<< "$status_json")"
            echo "Central deployment state: $state"
            if [[ "$state" == "$expected_state" ]]; then
              if [[ "$state" == "VALIDATED" ]]; then
                echo "Central validated the bundle. Publish deployment $deployment_id in the Portal after reviewing it." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            if [[ "$state" == "FAILED" ]]; then
              jq '.errors // .' <<< "$status_json"
              exit 1
            fi
            sleep 15
          done

          echo "::error title=Central timeout::Deployment $deployment_id did not reach $expected_state within 30 minutes."
          exit 1

      - name: Publish to Gradle Plugin Portal
        if: inputs.targets == 'both' || inputs.targets == 'gradle-plugin-portal'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash ./gradlew publishPlugins --no-daemon --stacktrace

      - name: Summarize publication
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: echo "Release $RELEASE_VERSION completed the protected $TARGETS publishing path." >> "$GITHUB_STEP_SUMMARY"
