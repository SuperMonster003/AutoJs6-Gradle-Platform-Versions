name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Temurin 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install scraper dependencies
        run: npm --prefix .utils ci --no-audit --no-fund

      - name: Test scraper parsers
        run: npm --prefix .utils test

      - name: Test Gradle plugin
        run: bash ./gradlew check --no-daemon

      - name: Verify headless Temurin decision
        run: bash ./gradlew -p sample printPlatformVersions --no-daemon

      - name: Prepare negative Android fixture
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install negative fixture SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Require rejection of a 4 KB native library
        shell: bash
        run: |
          if bash ./gradlew -p sample/native-alignment assembleDebug --no-daemon; then
            echo "::error::The intentionally unaligned APK passed verification."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('sample/native-alignment/build/reports/native-alignment/Debug.json').read_text())
          assert report['summary']['ok'] is False
          assert any('libunaligned.so' in e and 'PT_LOAD alignment 4096' in e for e in report['summary']['errors'])
          PY

      - name: Upload native alignment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-alignment
          path: sample/native-alignment/build/reports/native-alignment/
